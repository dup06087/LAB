name: WORKER3615 P0-C provider URL identity diagnostic

on:
  push:
    branches:
      - worker3615-p0c-url-identity-diagnostic-20261003
    paths:
      - ".github/workflows/worker3615-p0c-url-identity-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect exact 67 provider inventory URL identities only
        shell: bash
        env:
          FROZEN_DAYS_JSON: '["2024-11-06","2024-11-07","2024-11-10","2024-11-11","2024-11-12","2024-11-13","2024-12-05","2024-12-06","2024-12-09","2024-12-10","2024-12-20","2024-12-21","2024-12-27","2024-12-28","2025-01-09","2025-01-10","2025-01-20","2025-01-21","2025-01-23","2025-01-24","2025-02-03","2025-02-04","2025-02-12","2025-02-13","2025-02-25","2025-02-26","2025-02-27","2025-02-28","2025-03-01","2025-03-02","2025-03-03","2025-03-04","2025-03-05","2025-03-06","2025-03-07","2025-03-08","2025-03-10","2025-03-13","2025-03-17","2025-04-03","2025-04-08","2025-04-10","2025-04-23","2025-07-11","2025-08-15","2025-08-23","2025-08-25","2025-09-23","2025-10-17","2025-10-20","2025-10-22","2025-10-30","2025-11-22","2025-12-18","2026-01-14","2026-01-22","2026-02-03","2026-02-04","2026-02-05","2026-02-06","2026-02-17","2026-02-21","2026-02-26","2026-03-02","2026-03-09","2026-03-27","2026-03-31"]'
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          API = "https://www.okx.com/api/v5/public/market-data-history"
          INST_ID = "BTC-USDT-SWAP"
          STATIC_HOST = "static.okx.com"
          UA = "worker3615-p0c-url-identity-diagnostic/2.0"
          days = [date.fromisoformat(x).isoformat() for x in json.loads(os.environ["FROZEN_DAYS_JSON"])]

          def expected_url(day):
              return (
                  "https://static.okx.com/cdn/okex/traderecords/trades/daily/"
                  f"{day.replace('-', '')}/{INST_ID}-trades-{day}.zip"
              )

          if len(days) != 67 or len(set(days)) != 67:
              raise RuntimeError(f"frozen date count/uniqueness drift {len(days)} {len(set(days))}")
          days = sorted(days)
          if days[0] != "2024-11-06" or days[-1] != "2026-03-31":
              raise RuntimeError("frozen date edge drift")
          required = {day: expected_url(day) for day in days}

          def ranges(days):
              parsed = [date.fromisoformat(x) for x in days]
              out=[]; start=prev=parsed[0]; count=1
              for cur in parsed[1:]:
                  if cur == prev + timedelta(days=1) and count < 10:
                      prev=cur; count += 1
                  else:
                      out.append((start.isoformat(), prev.isoformat()))
                      start=prev=cur; count=1
              out.append((start.isoformat(), prev.isoformat()))
              return out

          query_ranges = ranges(days)
          if len(query_ranges) != 41:
              raise RuntimeError(f"query group drift {len(query_ranges)}")

          def utc8_ms(day):
              d=date.fromisoformat(day)
              dt=datetime(d.year,d.month,d.day,tzinfo=timezone(timedelta(hours=8)))
              return int(dt.astimezone(timezone.utc).timestamp()*1000)

          def get_json(url, timeout=30):
              last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":UA})
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last=e
                      if attempt==5: raise
                      time.sleep(attempt)
              raise RuntimeError(last)

          observed={}
          requests_meta=[]
          for start,end in query_ranges:
              q=urllib.parse.urlencode({
                  "module":"1","instType":"SWAP","instFamilyList":"BTC-USDT",
                  "dateAggrType":"daily","begin":str(utc8_ms(start)),"end":str(utc8_ms(end)),
              })
              url=API+"?"+q
              payload=get_json(url)
              if str(payload.get("code"))!="0":
                  raise RuntimeError(f"provider code drift {payload}")
              for block in payload.get("data",[]):
                  if block.get("dateAggrType")!="daily":
                      raise RuntimeError(f"dateAggrType drift {block.get('dateAggrType')!r}")
                  for detail in block.get("details",[]):
                      if detail.get("instType")!="SWAP" or detail.get("instFamily")!="BTC-USDT":
                          raise RuntimeError("selector drift")
                      for item in detail.get("groupDetails",[]):
                          fn=str(item.get("filename") or "")
                          prefix="BTC-USDT-SWAP-trades-"
                          if not fn.startswith(prefix) or not fn.endswith(".zip"):
                              raise RuntimeError(f"filename drift {fn!r}")
                          day=fn[len(prefix):-4]
                          if day not in required:
                              raise RuntimeError(f"provider returned nonallowlisted date {day}")
                          if day in observed:
                              raise RuntimeError(f"duplicate provider day {day}")
                          observed[day]={
                              "day":day,
                              "filename":fn,
                              "expected_url":required[day],
                              "provider_url":str(item.get("url") or ""),
                              "sizeMB":str(item.get("sizeMB") or ""),
                          }
              requests_meta.append({"start":start,"end":end,"url":url})
              time.sleep(0.10)

          missing=[d for d in days if d not in observed]
          rows=[]; exact=0; same_origin_path=0; no_fragment=0; patterns={}
          for day in days:
              row=observed.get(day)
              if row is None: continue
              e=urllib.parse.urlsplit(row["expected_url"])
              g=urllib.parse.urlsplit(row["provider_url"])
              same_path=(e.scheme,e.netloc,e.path)==(g.scheme,g.netloc,g.path)
              exact_match=row["expected_url"]==row["provider_url"]
              if exact_match: exact += 1
              if same_path: same_origin_path += 1
              if not g.fragment: no_fragment += 1
              q=urllib.parse.parse_qsl(g.query,keep_blank_values=True)
              key=json.dumps(q,separators=(",",":"))
              patterns[key]=patterns.get(key,0)+1
              rows.append({
                  **row,
                  "exact_match":exact_match,
                  "same_scheme_host_path":same_path,
                  "provider_scheme":g.scheme,
                  "provider_host":g.hostname,
                  "provider_path":g.path,
                  "provider_query":g.query,
                  "provider_fragment":g.fragment,
              })

          status="PASS_DIAGNOSTIC" if len(rows)==67 and not missing else "INCOMPLETE"
          out={
              "schema_version":1,
              "status":status,
              "task":"worker3615-p0c-url-identity-diagnostic-20261003",
              "required_dates":67,
              "returned_required_dates":len(rows),
              "missing_dates":missing,
              "query_groups":len(query_ranges),
              "exact_url_matches":exact,
              "same_scheme_host_path":same_origin_path,
              "no_fragment_count":no_fragment,
              "query_patterns":patterns,
              "requests":requests_meta,
              "rows":rows,
              "payload_downloaded":False,
              "source_values_opened":False,
              "feature_values_opened":False,
              "outcomes_opened":False,
              "event_reselection":False,
              "research_semantics_changed":False,
              "completed_at_utc":datetime.now(timezone.utc).isoformat(),
          }
          Path("out/url_identity_diagnostic.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print(json.dumps({
              "status":status,
              "returned_required_dates":len(rows),
              "missing_count":len(missing),
              "exact_url_matches":exact,
              "same_scheme_host_path":same_origin_path,
              "no_fragment_count":no_fragment,
              "query_patterns":patterns,
          },sort_keys=True))
          if status!="PASS_DIAGNOSTIC":
              raise SystemExit(2)
          PY

      - name: Upload URL identity diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: p0c-provider-url-identity-diagnostic
          path: out/url_identity_diagnostic.json
          retention-days: 3
          if-no-files-found: error
