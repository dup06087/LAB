name: GPT DIR049 module2 candidate WORKER9245

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpt-dir049-module2-candidate-worker9245.yml"

permissions:
  contents: read
  actions: read

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install parquet runtime
        run: python -m pip install --disable-pip-version-check -q pandas pyarrow

      - name: Download pinned official neutral artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dup06087/LAB/actions/artifacts/11156111731/zip" \
            -o source.zip
          echo "1f948b39b1d4fc58fea5e8562543b91f995b323d6f5f1b826ec6e87d17a58aaa  source.zip" | sha256sum -c -

      - name: Project frozen DIR049 source candidate
        run: python scripts/worker9245_dir049_module2_candidate.py

      - name: Upload DIR049 candidate
        uses: actions/upload-artifact@v4
        with:
          name: worker9245-dir049-module2-candidate
          path: out/
          retention-days: 7
          if-no-files-found: error
