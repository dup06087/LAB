name: WORKER5224 DIR040 8peer feature materialize

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker5224-dir040-feature-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Reuse exact neutral source artifact
        run: |
          set -euo pipefail
          rm -rf input
          mkdir -p input
          gh run download 37243396723 --repo dup06087/LAB \
            --name worker5224-dir040-8peer-module2-2024-10-2026-03 \
            --dir input
          echo "2312f2dcc652d3f53d9466acc600771f4e6432c8297710b287153a11e84ae558  input/w1018_dir040_8peer_module2_1m_2024-10_2026-03.csv.gz" | sha256sum -c -
          test "$(wc -l < artifacts/worker5224/w1018_dir040_btc535_clocks.csv)" -eq 536
          echo "dd89670c685f1393de78cc22a33aecd84de2b859090d1f063e628bf13e35130f  artifacts/worker5224/w1018_dir040_btc535_clocks.csv" | sha256sum -c -

      - name: Build frozen 535x8 feature and availability
        run: |
          set -euo pipefail
          rm -rf /tmp/dir040_feature
          mkdir -p /tmp/dir040_feature
          python - <<'PY'
          import csv,gzip,json,hashlib,math,statistics
          from pathlib import Path
          from datetime import datetime, timezone

          src=Path("input/w1018_dir040_8peer_module2_1m_2024-10_2026-03.csv.gz")
          src_manifest_path=Path("input/manifest.json")
          clock=Path("artifacts/worker5224/w1018_dir040_btc535_clocks.csv")
          out=Path("/tmp/dir040_feature")
          peers=["ETH","SOL","XRP","DOGE","ADA","LTC","BCH","LINK"]
          instr={p:f"{p}-USDT-SWAP" for p in peers}
          win=60
          flat_threshold=0.0002

          def sha(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""):
                      h.update(b)
              return h.hexdigest()

          clocks=[]
          with clock.open(newline="") as f:
              for row in csv.DictReader(f):
                  clocks.append({
                      "event_id":row["event_id"],
                      "decision_ms":int(row["decision_ms"]),
                      "feature_end_ms":int(row["feature_end_ms"]),
                      "feature_available_ms":int(row["feature_available_ms"]),
                  })
          if len(clocks)!=535 or len({r["event_id"] for r in clocks})!=535:
              raise SystemExit("clock identity failure")
          for r in clocks:
              if r["feature_available_ms"]>r["decision_ms"] or r["feature_end_ms"]+60000!=r["feature_available_ms"]:
                  raise SystemExit("clock PIT failure")

          required=set()
          for r in clocks:
              for k in range(win):
                  required.add(r["feature_end_ms"]-(win-1-k)*60000)

          values={p:{} for p in peers}
          source_rows={p:0 for p in peers}
          with gzip.open(src,"rt",encoding="utf-8",newline="") as f:
              for row in csv.DictReader(f):
                  p=row["asset"]
                  ts=int(row["open_time"])
                  source_rows[p]+=1
                  if ts not in required:
                      continue
                  if ts in values[p]:
                      raise SystemExit(f"duplicate required minute {p} {ts}")
                  o,h,l,c,v=map(float,[row["open"],row["high"],row["low"],row["close"],row["volume"]])
                  if not all(math.isfinite(x) for x in (o,h,l,c,v)) or min(o,h,l,c)<=0 or h<max(o,c,l) or l>min(o,c,h) or v<0:
                      raise SystemExit(f"invalid OHLCV {p} {ts}")
                  values[p][ts]=(o,h,l,c,v)

          availability=[]
          features=[]
          peer_missing={p:0 for p in peers}
          for pos,e in enumerate(clocks):
              expected=[e["feature_end_ms"]-(win-1-k)*60000 for k in range(win)]
              rets={}
              all_complete=True
              for p in peers:
                  n=sum(ts in values[p] for ts in expected)
                  complete=(n==win)
                  all_complete=all_complete and complete
                  if not complete:
                      peer_missing[p]+=1
                  r=""
                  if complete:
                      first=values[p][expected[0]]
                      last=values[p][expected[-1]]
                      r=math.log(last[3]/first[0])
                  rets[p]=r
                  availability.append([
                      e["event_id"],pos,p,instr[p],e["decision_ms"],e["feature_end_ms"],e["feature_available_ms"],
                      expected[0],expected[-1],win,n,win-n,int(complete)
                  ])

              med=U=D=asym=""
              feature_complete=False
              flat=False
              if all_complete:
                  arr=[float(rets[p]) for p in peers]
                  med=statistics.median(arr)
                  x=sorted(v-med for v in arr)
                  U=sum(x[-2:])/2
                  D=sum(abs(v) for v in x[:2])/2
                  denom=U+D
                  feature_complete=True
                  flat=denom<flat_threshold
                  if not flat:
                      asym=(U-D)/denom
              features.append([
                  e["event_id"],pos,e["decision_ms"],e["feature_end_ms"],e["feature_available_ms"],int(all_complete),
                  *[rets[p] for p in peers],int(feature_complete),int(flat),med,U,D,asym
              ])

          with (out/"source_availability.csv").open("w",newline="") as f:
              w=csv.writer(f)
              w.writerow(["event_id","event_position","peer","instrument","decision_ms","feature_end_ms","feature_available_ms",
                          "window_start_ms","window_end_ms","expected_minutes","present_timestamp_minutes","missing_timestamp_minutes",
                          "exact_timestamp_coverage"])
              w.writerows(availability)

          with (out/"feature_table.csv").open("w",newline="") as f:
              w=csv.writer(f)
              w.writerow(["event_id","event_position","decision_ms","feature_end_ms","feature_available_ms","all_8peer_source_complete",
                          *[f"{p.lower()}_return_60m" for p in peers],"feature_complete","cross_section_flat",
                          "median_return","U","D","peer_tail_shape_asym"])
              w.writerows(features)

          complete=sum(r[5]==1 for r in features)
          flat=sum(r[-5]==1 for r in features)
          usable=sum(r[5]==1 and r[-5]==0 and r[-1]!="" for r in features)
          source_manifest=json.load(src_manifest_path.open())
          manifest={
              "schema_version":1,
              "status":"W1018_DIR040_8PEER_MODULE2_SOURCE_FEATURE_COMPLETE",
              "worker":"WORKER5224",
              "task_id":"worker5224-w1018-dir040-8peer-module2-source-feature-build-20261005",
              "source_reuse":{
                  "repo":"dup06087/LAB",
                  "workflow_run_id":37243396723,
                  "artifact_id":11318540582,
                  "artifact_digest_sha256":"388b56fdeb1975498b0d3561112a15fc505907c879ef581f969a1199f407bab4",
                  "neutral_csv_gz_sha256":sha(src),
                  "neutral_manifest_sha256":sha(src_manifest_path)
              },
              "clock":{
                  "git_blob":"2190ea7ac7d208feb39b26f089b195ae7fe26f76",
                  "sha256":sha(clock),
                  "events":535,
                  "window_minutes":60
              },
              "provider":"OKX",
              "source_endpoint":"https://www.okx.com/api/v5/public/market-data-history",
              "source_module":2,
              "date_aggregation":"monthly",
              "month_start":"2024-10",
              "month_end":"2026-03",
              "archive_count":len(source_manifest["archives"]),
              "source_total_rows":source_manifest["total_rows"],
              "source_rows_by_peer":source_rows,
              "peers":peers,
              "complete_8peer_events":complete,
              "feature_missing_events":535-complete,
              "cross_section_flat_events":flat,
              "feature_usable_nonflat_events":usable,
              "peer_missing_event_counts":peer_missing,
              "feature_formula":"r_i=log(close_last/open_first); median demean; U=mean(two largest); D=mean(abs(two smallest)); asym=(U-D)/(U+D); U+D<0.0002 => HOLD",
              "flat_threshold_return":flat_threshold,
              "archive_receipts":source_manifest["archives"],
              "source_assets":source_manifest["assets"],
              "source_neutral_output_sha256":source_manifest["output_sha256"],
              "output_sha256":{
                  "feature_table":sha(out/"feature_table.csv"),
                  "source_availability":sha(out/"source_availability.csv")
              },
              "research_event_filtering_performed":False,
              "outcome_table_read":False,
              "future_outcomes_opened":False,
              "actions_computed":False,
              "economics_computed":False,
              "inference_computed":False,
              "event_reselection":False,
              "peer_substitution":False,
              "interpolation":False,
              "forward_fill":False,
              "missing_as_zero":False,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
          }
          (out/"manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "status":"PASS",
              "complete_8peer_events":complete,
              "feature_missing_events":535-complete,
              "cross_section_flat_events":flat,
              "feature_usable_nonflat_events":usable,
              "peer_missing_event_counts":peer_missing,
              "feature_table_sha256":manifest["output_sha256"]["feature_table"],
              "availability_sha256":manifest["output_sha256"]["source_availability"]
          },sort_keys=True))
          if complete!=535 or usable!=535 or any(peer_missing.values()):
              raise SystemExit("unexpected source incompleteness")
          PY

      - name: Upload compact
        uses: actions/upload-artifact@v4
        with:
          name: worker5224-dir040-8peer-feature-compact
          path: /tmp/dir040_feature
          retention-days: 3
          if-no-files-found: error

      - name: Publish compact to LAB main
        run: |
          set -euo pipefail
          git config user.name "WORKER5224"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf artifacts/worker5224/w1018_dir040_8peer_feature
            mkdir -p artifacts/worker5224/w1018_dir040_8peer_feature
            cp -a /tmp/dir040_feature/. artifacts/worker5224/w1018_dir040_8peer_feature/
            git add artifacts/worker5224/w1018_dir040_8peer_feature
            if git diff --cached --quiet; then
              echo "Already published"
              exit 0
            fi
            git commit -m "WORKER5224 publish DIR040 8peer feature compact"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
