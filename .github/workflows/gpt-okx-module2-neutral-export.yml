name: GPT OKX module2 neutral export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpt-okx-module2-neutral-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Export neutral OKX 1m candles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import csv, gzip, hashlib, io, json, re, time, urllib.parse, urllib.request, zipfile
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          OUT=Path("out")
          API="https://www.okx.com/api/v5/public/market-data-history"
          ASSETS={
              "BTC":{"family":"BTC-USDT","inst":"BTC-USDT-SWAP"},
              "ETH":{"family":"ETH-USDT","inst":"ETH-USDT-SWAP"},
          }
          START="2024-09"
          END="2026-04"
          UA="gpt-public-neutral-okx-module2-export/1.0"

          def months(start,end):
              sy,sm=map(int,start.split("-")); ey,em=map(int,end.split("-"))
              out=[]; y,m=sy,sm
              while (y,m) <= (ey,em):
                  out.append(f"{y:04d}-{m:02d}")
                  m += 1
                  if m==13: y,m=y+1,1
              return out

          LABELS=months(START,END)
          assert len(LABELS)==20

          def month_start_utc8_ms(label):
              y,m=map(int,label.split("-"))
              dt=datetime(y,m,1,tzinfo=timezone.utc)-timedelta(hours=8)
              return int(dt.timestamp()*1000)

          def next_month_start_utc8_ms(label):
              y,m=map(int,label.split("-"))
              if m==12: y,m=y+1,1
              else: m += 1
              dt=datetime(y,m,1,tzinfo=timezone.utc)-timedelta(hours=8)
              return int(dt.timestamp()*1000)

          def get_bytes(url, timeout=90):
              last=None
              for attempt in range(6):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":UA})
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          return r.read()
                  except Exception as e:
                      last=e
                      if attempt<5: time.sleep(0.5*(attempt+1))
              raise RuntimeError(f"GET failed {url}: {last}")

          def get_json(url):
              return json.loads(get_bytes(url,30).decode("utf-8"))

          def inventory(asset):
              fam=ASSETS[asset]["family"]; inst=ASSETS[asset]["inst"]
              found={}
              for i in range(0,len(LABELS),10):
                  chunk=LABELS[i:i+10]
                  begin=month_start_utc8_ms(chunk[0])
                  end=next_month_start_utc8_ms(chunk[-1])-86400000
                  q=urllib.parse.urlencode({
                      "module":"2","instType":"SWAP","instFamilyList":fam,
                      "dateAggrType":"monthly","begin":str(begin),"end":str(end)
                  })
                  payload=get_json(API+"?"+q)
                  if payload.get("code")!="0":
                      raise RuntimeError(payload)
                  for group in payload.get("data",[]):
                      if group.get("dateAggrType")!="monthly":
                          raise RuntimeError("aggregation drift")
                      for detail in group.get("details",[]):
                          if detail.get("instType")!="SWAP" or detail.get("instFamily")!=fam:
                              continue
                          for item in detail.get("groupDetails",[]):
                              fn=str(item.get("filename",""))
                              m=re.fullmatch(re.escape(inst)+r"-candlesticks-(\d{4}-\d{2})\.zip",fn)
                              if not m: raise RuntimeError(f"filename drift {fn}")
                              label=m.group(1)
                              if label not in LABELS: continue
                              url=str(item.get("url",""))
                              p=urllib.parse.urlparse(url)
                              if p.scheme!="https" or p.hostname!="static.okx.com" or Path(p.path).name!=fn:
                                  raise RuntimeError(f"url drift {url}")
                              row={"asset":asset,"month":label,"filename":fn,"url":url,"sizeMB":str(item.get("sizeMB",""))}
                              if label in found and found[label]!=row:
                                  raise RuntimeError(f"conflict {asset} {label}")
                              found[label]=row
              miss=[x for x in LABELS if x not in found]
              if miss: raise RuntimeError(f"missing inventory {asset}: {miss}")
              return [found[x] for x in LABELS]

          sha=lambda b: hashlib.sha256(b).hexdigest()
          manifest={"schema_version":1,"provider":"OKX","module":2,"date_aggregation":"monthly",
                    "month_start":START,"month_end":END,"month_count":len(LABELS),
                    "assets":[],"archives":[],"generated_at_utc":datetime.now(timezone.utc).isoformat(),
                    "research_event_filtering_performed":False,"future_outcomes_opened":False}

          out_csv=OUT/"okx_module2_1m_2024-09_2026-04.csv.gz"
          total=0
          with gzip.open(out_csv,"wt",newline="",encoding="utf-8") as f:
              w=csv.writer(f)
              w.writerow(["asset","instrument","open_time","open","high","low","close","volume","vol_ccy","vol_ccy_quote"])
              for asset in ("BTC","ETH"):
                  rows_asset=0
                  inv=inventory(asset)
                  for rec in inv:
                      payload=get_bytes(rec["url"],180)
                      with zipfile.ZipFile(io.BytesIO(payload)) as z:
                          members=[n for n in z.namelist() if n.lower().endswith(".csv")]
                          if len(members)!=1: raise RuntimeError("archive member drift")
                          csv_bytes=z.read(members[0])
                      reader=csv.DictReader(io.StringIO(csv_bytes.decode("utf-8-sig")))
                      fields=set(reader.fieldnames or [])
                      raw10={"instrument_name","open","high","low","close","vol","vol_ccy","vol_ccy_quote","open_time","confirm"}
                      native8={"open_time","open","high","low","close","volume","vol_ccy","vol_ccy_quote"}
                      if fields==raw10:
                          variant="RAW10"
                      elif fields==native8:
                          variant="NATIVE8"
                      else:
                          raise RuntimeError(f"schema drift {sorted(fields)}")
                      n=0; first=None; last=None
                      for row in reader:
                          if variant=="RAW10":
                              if row["instrument_name"]!=ASSETS[asset]["inst"] or str(row["confirm"])!="1":
                                  raise RuntimeError("instrument/confirm drift")
                              volume=row["vol"]
                          else:
                              volume=row["volume"]
                          ts=int(row["open_time"])
                          if first is None: first=ts
                          last=ts
                          w.writerow([asset,ASSETS[asset]["inst"],ts,row["open"],row["high"],row["low"],row["close"],volume,row["vol_ccy"],row["vol_ccy_quote"]])
                          n += 1
                      if n<=0: raise RuntimeError("empty archive")
                      rows_asset += n; total += n
                      manifest["archives"].append({
                          **rec,"zip_sha256":sha(payload),"csv_sha256":sha(csv_bytes),
                          "schema_variant":variant,"rows":n,"first_open_time":first,"last_open_time":last
                      })
                  manifest["assets"].append({"asset":asset,"instrument":ASSETS[asset]["inst"],"rows":rows_asset})
          manifest["total_rows"]=total
          manifest["output_file"]=out_csv.name
          manifest["output_sha256"]=hashlib.sha256(out_csv.read_bytes()).hexdigest()
          (OUT/"manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({"status":"PASS","rows":total,"sha256":manifest["output_sha256"]},sort_keys=True))
          PY

      - name: Upload neutral dataset
        uses: actions/upload-artifact@v4
        with:
          name: gpt-okx-module2-neutral-2024-09-2026-04
          path: |
            out/okx_module2_1m_2024-09_2026-04.csv.gz
            out/manifest.json
          retention-days: 1
          if-no-files-found: error
