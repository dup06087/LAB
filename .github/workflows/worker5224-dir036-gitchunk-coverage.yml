name: WORKER5224 DIR036 exact parquet footer audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker5224-dir036-gitchunk-coverage.yml"
      - "artifacts/worker5224/w1018_dir036_parquet_footer.b64.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  footer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install metadata parser
        run: python -m pip install --disable-pip-version-check pyarrow

      - name: Decode exact footer and inspect metadata only
        run: |
          set -euo pipefail
          rm -rf /tmp/dir036_footer
          mkdir -p /tmp/dir036_footer
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          import pyarrow.parquet as pq

          src=Path("artifacts/worker5224/w1018_dir036_parquet_footer.b64.txt")
          obj=json.loads(src.read_text())
          assert obj["source_sha256"]=="34fc490ff3df8bdf0d70d102d2acbe6576876353ce7c125ab623ce195ee31abc"
          assert obj["source_bytes"]==96465318
          assert obj["final_chunk_git_blob"]=="9b5812b75f848cc6dac38d2667fd1be610f4efc5"
          assert obj["parquet_footer_metadata_bytes"]==6087
          assert obj["guardrails"]["row_pages_copied"] is False
          footer=base64.b64decode(obj["footer_plus_trailer_base64"])
          assert len(footer)==6095
          assert footer[-4:]==b"PAR1"

          sparse=Path("/tmp/dir036_footer/exact_footer_sparse.parquet")
          with sparse.open("wb") as w:
              w.write(b"PAR1")
              w.seek(obj["source_bytes"]-len(footer))
              w.write(footer)
          assert sparse.stat().st_size==obj["source_bytes"]

          pf=pq.ParquetFile(sparse)
          md=pf.metadata
          out={
              "schema_version":1,
              "status":"EXACT_LOCAL_PARQUET_FOOTER_METADATA_PARSED",
              "worker":"WORKER5224",
              "source_sha256":obj["source_sha256"],
              "source_bytes":obj["source_bytes"],
              "footer_metadata_bytes":obj["parquet_footer_metadata_bytes"],
              "num_rows":md.num_rows,
              "num_columns":md.num_columns,
              "num_row_groups":md.num_row_groups,
              "format_version":md.format_version,
              "created_by":md.created_by,
              "schema_names":pf.schema_arrow.names,
              "row_groups":[],
              "row_pages_read":False,
              "ohlcv_values_opened":False,
              "future_outcomes_opened":False,
          }
          for rg_i in range(md.num_row_groups):
              rg=md.row_group(rg_i)
              rec={
                  "row_group":rg_i,
                  "num_rows":rg.num_rows,
                  "total_byte_size":rg.total_byte_size,
                  "sorting_columns":[str(x) for x in rg.sorting_columns],
                  "columns":[]
              }
              for ci in range(rg.num_columns):
                  col=rg.column(ci)
                  st=col.statistics
                  crec={
                      "column":col.path_in_schema,
                      "num_values":col.num_values,
                      "file_offset":col.file_offset,
                      "data_page_offset":col.data_page_offset,
                      "dictionary_page_offset":col.dictionary_page_offset,
                      "total_compressed_size":col.total_compressed_size,
                      "total_uncompressed_size":col.total_uncompressed_size,
                      "has_column_index":col.has_column_index,
                      "has_offset_index":col.has_offset_index,
                      "compression":str(col.compression),
                      "encodings":[str(x) for x in col.encodings],
                      "has_statistics":st is not None,
                  }
                  if st is not None:
                      crec.update({
                          "null_count":st.null_count,
                          "distinct_count":st.distinct_count,
                          "min":str(st.min),
                          "max":str(st.max),
                          "has_min_max":st.has_min_max,
                      })
                  rec["columns"].append(crec)
              out["row_groups"].append(rec)
          target=Path("/tmp/dir036_footer/footer_metadata.json")
          target.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload footer metadata receipt
        uses: actions/upload-artifact@v4
        with:
          name: worker5224-dir036-exact-footer-metadata
          path: /tmp/dir036_footer/footer_metadata.json
          retention-days: 3
          if-no-files-found: error

      - name: Publish footer metadata to LAB
        run: |
          set -euo pipefail
          git config user.name "WORKER5224"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p artifacts/worker5224/w1018_dir036_footer_metadata
            cp /tmp/dir036_footer/footer_metadata.json artifacts/worker5224/w1018_dir036_footer_metadata/footer_metadata.json
            git add artifacts/worker5224/w1018_dir036_footer_metadata/footer_metadata.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "WORKER5224 publish DIR036 exact parquet footer metadata"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
